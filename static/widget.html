<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Trattoria Assistent</title>
  <link rel="stylesheet" href="/static/widget.css">
</head>
<body>
  <div class="widget">
    <header class="widget-header">
      <div class="header-info">
        <div class="header-icon" aria-hidden="true">🍝</div>
        <div>
          <h1>La Trattoria</h1>
          <p id="header-subtitle">KI-Assistent · Bad Nauheim</p>
        </div>
      </div>
      <button id="close-btn" class="icon-btn" type="button" aria-label="Chat schließen" title="Schließen">×</button>
    </header>

    <section id="chat-view" class="panel panel-active">
      <main id="messages" class="messages" aria-live="polite">
        <div class="msg assistant">
          <div class="bubble">
            Buongiorno! Fragen Sie mich gern zu Speisekarte, Allergenen oder Öffnungszeiten — oder blättern Sie direkt in unserer Speisekarte.
          </div>
        </div>
      </main>

      <div class="quick-actions">
        <button type="button" class="quick-btn" data-prompt="Welche vegetarischen Gerichte habt ihr?">Vegetarisch</button>
        <button type="button" class="quick-btn" data-prompt="Was sind eure Öffnungszeiten?">Öffnungszeiten</button>
        <button type="button" class="quick-btn" id="menu-btn">Speisekarte</button>
      </div>

      <form id="chat-form" class="input-row">
        <textarea id="message-input" rows="1" placeholder="Ihre Frage..." required></textarea>
        <button id="send-btn" type="submit" aria-label="Senden">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </section>

    <section id="menu-view" class="panel">
      <div class="menu-toolbar">
        <button id="back-to-chat" type="button" class="back-btn">← Chat</button>
        <span class="menu-title">Speisekarte</span>
      </div>

      <p class="menu-hint">Gerichte &amp; Getränke — Preise inkl. MwSt.</p>
      <div id="menu-loading" class="menu-loading" hidden>Lade Speisekarte...</div>
      <div id="menu-error" class="menu-error" hidden></div>
      <div id="category-tabs" class="category-tabs"></div>
      <div id="menu-items" class="menu-items"></div>

      <div class="menu-footer">
        <p class="menu-phone">
          Reservierung telefonisch: <a href="tel:060329359977">06032 9359977</a>
        </p>
      </div>
    </section>
  </div>

  <script src="/static/widget.js?v=7"></script>
</body>
</html>
